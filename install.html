<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>4目並べ｜アイコンを選ぶ</title>
<link id="manifest" rel="manifest" href="./manifest.webmanifest?v=pink20261122"><link id="appleIcon" rel="apple-touch-icon" href="./apple-touch-icon.png?v=pink20261122"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="4目並べ"><meta name="theme-color" content="#152c68">
<style>*{box-sizing:border-box}body{margin:0;background:#101522;color:#f8f9ff;font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif}main{max-width:480px;margin:auto;padding:26px 20px 70px}h1{font-size:24px;margin:0 0 8px}p{color:#c4cadd;line-height:1.7;font-size:14px}.preview{display:flex;justify-content:center;margin:20px 0}canvas{width:174px;height:174px;border-radius:38px;box-shadow:0 16px 35px #0008}section{background:#1c2437;border:1px solid #303b52;padding:18px;border-radius:18px;margin:16px 0}h2{font-size:16px;margin:0 0 12px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}.colors label{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px;border-radius:10px;background:#121a2b;font-size:14px}.colors input{width:44px;height:34px;border:0;background:none}.button{display:block;text-align:center;width:100%;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:700;background:#f4f6ff;color:#141927;cursor:pointer;text-decoration:none;margin:10px 0}.button.secondary{background:#293650;color:white}.button:disabled{opacity:.5}#steps{white-space:pre-line;background:#0f1b31;border-radius:12px;padding:14px;font-size:14px;line-height:1.8}#steps:empty{display:none}small{color:#abb6cb;line-height:1.6;display:block}#copy{font-size:13px}#url{font-size:12px;word-break:break-all;color:#9eb7ff}a{color:#b6d2ff}</style></head><body><main><a href="./" style="display:inline-block;margin-bottom:16px;text-decoration:none">← ゲーム・ロビーに戻る</a><h1>4目並べ</h1><p>好きな色のアイコンで、ホーム画面から遊ぼう。<br>4つの丸と背景の色を自由に選べます。</p>
<div class="preview"><canvas id="preview" width="512" height="512"></canvas></div><section><h2>アイコンの色を決める</h2><div class="colors"><label>左上<input type="color" value="#e66589"></label><label>右上<input type="color" value="#f5d7d8"></label><label>左下<input type="color" value="#f2b9d1"></label><label>右下<input type="color" value="#d488a4"></label><label>背景<input type="color" value="#f5dce6"></label></div></section>
<button id="prepare" class="button">この色でホーム画面に追加</button><div id="steps" role="status" aria-live="polite"></div><button id="save" class="button secondary">このアイコン画像を保存（PNG）</button><a href="./" class="button secondary">インストールせずゲームで遊ぶ</a><small>ホーム画面のアイコンは、追加後に自動で色が変わるものではありません。色を変え直す場合は追加し直してください。Android・iPhoneのブラウザによって、選んだ画像が採用されない場合があります。</small><p id="url"></p></main>
<script>
(function(){const ua=navigator.userAgent||'';if(/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)){location.replace('./ios-install.html');}})();
(()=>{'use strict';const inputs=[...document.querySelectorAll('.colors input')],canvas=document.getElementById('preview'),ctx=canvas.getContext('2d'),steps=document.getElementById('steps'),btn=document.getElementById('prepare');const defaults=['#e66589','#f5d7d8','#f2b9d1','#d488a4','#f5dce6'];const q=new URLSearchParams(location.search),code=q.get('icon');
const isHex=s=>/^[0-9a-f]{30}$/i.test(s||'');if(isHex(code))code.match(/.{6}/g).forEach((s,i)=>inputs[i].value='#'+s);else try{const c=JSON.parse(localStorage.getItem('c4-personal-icon-v1'));if(Array.isArray(c)&&c.length===5&&c.every(s=>/^#[0-9a-f]{6}$/i.test(s)))c.forEach((s,i)=>inputs[i].value=s)}catch(e){}
function key(){return inputs.map(x=>x.value.slice(1)).join('').toLowerCase()}
function paint(c,n){const s=n/512;c.clearRect(0,0,n,n);c.fillStyle=inputs[4].value;c.fillRect(0,0,n,n);c.fillStyle="#fff0f5";c.beginPath();c.roundRect(56*s,56*s,400*s,400*s,80*s);c.fill();[[172,172],[340,172],[172,340],[340,340]].forEach(([x,y],i)=>{c.beginPath();c.arc(x*s,y*s,72*s,0,Math.PI*2);c.fillStyle=inputs[i].value;c.fill()})}
function draw(){paint(ctx,512);try{localStorage.setItem('c4-personal-icon-v1',JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}
inputs.forEach(x=>x.addEventListener('input',()=>{draw();steps.textContent='色を変更したので、もう一度「この色でホーム画面に追加」を押してください。'}));draw();
function png(n){const c=document.createElement('canvas');c.width=c.height=n;paint(c.getContext('2d'),n);return c.toDataURL('image/png')}
function save(){const a=document.createElement('a');a.href=png(512);a.download='4moku-icon.png';document.body.append(a);a.click();a.remove()}
document.getElementById('save').onclick=save;
const base=new URL('./',location.href),isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
async function installAssets(k){if(!('serviceWorker' in navigator)||!('caches' in window))throw Error('このブラウザではPWAの準備ができません');await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;const cache=await caches.open('4moku-palette-assets-v1');
for(const n of [180,192,512]){const b=await(await fetch(png(n))).blob();await cache.put(new URL('personal-icon/'+k+'/'+n+'.png',base),new Response(b,{headers:{'Content-Type':'image/png'}}))}
const icon=n=>new URL('personal-icon/'+k+'/'+n+'.png',base).pathname;const start=new URL('./?icon='+k,base);const m={id:start.pathname+'?icon='+k,name:'4目並べ',short_name:'4目並べ',start_url:start.pathname+start.search,scope:base.pathname,display:'standalone',background_color:inputs[4].value,theme_color:inputs[4].value,icons:[192,512].map(n=>({src:icon(n),sizes:n+'x'+n,type:'image/png',purpose:'any'}))};
await cache.put(new URL('personal-manifest/'+k+'.webmanifest',base),new Response(JSON.stringify(m),{headers:{'Content-Type':'application/manifest+json'}}));
return {manifest:new URL('personal-manifest/'+k+'.webmanifest',base).href,apple:new URL('personal-icon/'+k+'/180.png',base).href};}
async function apply(){const k=key();const a=await installAssets(k);if(!isIOS)document.getElementById('manifest').href=a.manifest;if(!isIOS)document.getElementById('appleIcon').href=a.apple;document.querySelector('meta[name="theme-color"]').content=inputs[4].value;history.replaceState(null,'','./install.html?icon='+k);document.getElementById('url').textContent='この配色のページ：'+location.href;return a}
btn.onclick=async()=>{btn.disabled=true;steps.textContent='アイコンを準備しています…';try{await apply();if(isIOS){steps.textContent='準備完了！ Safariの共有ボタン →「ホーム画面に追加」→「追加」を押してください。iPhoneでは標準のピンクアイコンを優先します。\n※iPhoneが選んだ色を反映しない場合は「このアイコン画像を保存」→「ショートカット」アプリで「URLを開く」を作成 →「ホーム画面に追加」で画像を指定してください。';}else{steps.textContent='準備完了！ Chromeの右上「︙」→「アプリをインストール」または「ホーム画面に追加」を押してください。\n※すでに4目並べを追加している場合は、先に古いアイコンを削除してください。';} }catch(e){steps.textContent='準備に失敗しました：'+e.message+'。HTTPSのGitHub Pages上で開いてください。'}finally{btn.disabled=false}};
if(isHex(code)){apply().catch(()=>{});steps.textContent='この配色で追加するには「この色でホーム画面に追加」を押してください。'}
})();
</script></body></html>
