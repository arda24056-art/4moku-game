<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhoneでホーム画面に追加</title><meta name="theme-color" content="#f5dce6"><style>body{margin:0;background:#f9e9ef;color:#422a35;font-family:-apple-system,system-ui,sans-serif}main{max-width:440px;margin:0 auto;padding:30px 22px;line-height:1.8}h1{font-size:23px}img{display:block;width:130px;height:130px;border-radius:28px;margin:22px auto}a{display:block;background:#ce668e;color:white;text-align:center;text-decoration:none;padding:14px;border-radius:14px;font-weight:bold}p{font-size:15px}</style></head><body><main><h1>iPhoneに4目並べを追加</h1><img src="./apple-touch-icon.png" alt="ピンクの4目並べアイコン"><p>iPhoneではこのピンクのアイコンを使用します。色の編集や写真の保存は必要ありません。</p><p>① 下のボタンでゲーム本体をSafariで開く<br>② Safariの共有ボタンを押す<br>③「ホーム画面に追加」→「追加」</p><a href="./">ゲームを開いてホーム画面に追加</a><p>追加したアイコンを押すと、アイコン作成画面ではなくゲームが開きます。</p></main></body></html>
