<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4目並べ</title>
<style>
:root{--bg:#f4f5f8;--fg:#1c2030;--sub:#6a7084;--card:#fff;--board:#2f5fd0;--hole:#dfe6fb;--R:#e5484d;--Y:#f5c542;--line:#d9dce6;--ok:#1a9b5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151d;--fg:#eceef6;--sub:#9aa0b6;--card:#1d2130;--board:#3a6ae0;--hole:#141a33;--line:#2c3145;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13151d;--fg:#eceef6;--sub:#9aa0b6;--card:#1d2130;--board:#3a6ae0;--hole:#141a33;--line:#2c3145;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:16px 14px 28px}
h1{font-size:20px;margin:4px 0 12px;display:flex;align-items:center;justify-content:space-between}
h1 small{font-size:12px;font-weight:400;color:var(--sub)}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.p{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;transition:.2s}
.p.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.p i{width:26px;height:26px;border-radius:50%;background:var(--c);flex:none}
.p b{display:block;font-size:14px}.p span{font-size:12px;color:var(--sub)}
.p em{margin-left:auto;font-style:normal;font-size:24px;font-weight:700}
#status{text-align:center;font-weight:700;min-height:28px;margin:6px 0 10px;font-size:17px}
#status.win{color:var(--ok)}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--board);padding:10px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);touch-action:manipulation}
.col{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;border:0;background:none;padding:0;border-radius:999px;cursor:pointer;font:inherit}
.col:disabled{cursor:default}
.col.hov{background:rgba(255,255,255,.14)}
.cell{aspect-ratio:1;border-radius:50%;background:var(--hole);position:relative;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.cell.R::after,.cell.Y::after,.cell.g::after{content:"";position:absolute;inset:6%;border-radius:50%}
.cell.R::after{background:var(--R)}.cell.Y::after{background:var(--Y)}
.cell.g::after{background:var(--gc);opacity:.35}
.cell.R::after,.cell.Y::after{box-shadow:inset 0 -3px 5px rgba(0,0,0,.25),inset 0 3px 4px rgba(255,255,255,.3)}
.cell.drop::after{animation:drop .45s cubic-bezier(.5,0,1,.6) both,bounce .3s .45s ease-out}
@keyframes drop{from{transform:translateY(calc(var(--d)*-112%))}to{transform:none}}
@keyframes bounce{40%{transform:translateY(-8%)}}
.cell.last{outline:3px solid #fff;outline-offset:-3px}
.cell.win::after{animation:pulse .8s infinite alternate;outline:4px solid #fff;outline-offset:-1px}
@keyframes pulse{to{transform:scale(.8)}}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
button.b{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.b.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.b:disabled{opacity:.4;cursor:default}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:12px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
[hidden]{display:none!important}
html,body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body{min-height:100vh;min-height:100dvh}
.p{min-width:0}.p>div{min-width:0}.pi b,.pi span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .k{color:#e8590c;font-weight:700}
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.gc{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.gc .logo{font-size:34px;letter-spacing:6px}.gc h2{margin:8px 0 4px;font-size:22px}.gc p{margin:0 0 16px;color:var(--sub);font-size:14px}
.gc input{width:100%;font:inherit;font-size:18px;text-align:center;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);outline:none}
.gc input:focus{border-color:var(--board)}
#nmErr{color:var(--R);font-size:13px;min-height:20px;margin:6px 0}
.gc .b{width:100%;min-height:48px;font-size:16px}
@media(max-width:480px){main{padding:8px 10px 18px}h1{font-size:18px;margin:2px 0 8px}.players{gap:8px;margin-bottom:8px}.p{padding:8px 10px;gap:8px}.p i{width:20px;height:20px}.p em{font-size:22px}#status{font-size:16px;margin:4px 0 8px}.board{gap:4px;padding:8px;border-radius:14px}.col{gap:4px}.btns button.b{flex:1 1 calc(50% - 8px);min-height:46px}.note{margin-top:8px}}
@media(hover:none){.kb{display:none}}
main{padding-bottom:88px!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card .row{display:flex;gap:8px;margin-top:10px}
.card input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);outline:none}
.card input:focus{border-color:var(--board)}
.card .b{min-height:46px}
#rnErr{color:var(--R);font-size:13px;min-height:18px;margin-top:4px}
.sec{font-size:15px;margin:6px 2px 8px;color:var(--sub)}
.ri{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rt{flex:1;min-width:0}.rt b,.rt small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rt small{color:var(--sub);font-size:12px;margin-top:2px}
.ri .b{min-height:42px}
.empty{color:var(--sub);text-align:center;font-size:14px;padding:18px 0}
#palBtn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;z-index:30;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#pal{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#sws{display:grid;grid-template-columns:repeat(5,34px);gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw.on{outline:3px solid var(--fg);outline-offset:1px}
.cl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--sub)}
.cl input{width:44px;height:30px;border:0;padding:0;background:none}
</style>
</head>
<body>
<main id="game" hidden>
<h1>4目並べ <small id="roomLbl"></small></h1>
<div class="players">
  <div class="p" id="pR" style="--c:var(--R)"><i></i><div class="pi"><b id="nR">赤</b><span id="wR"></span><span class="k" id="kR"></span></div><em id="sR">0</em></div>
  <div class="p" id="pY" style="--c:var(--Y)"><i></i><div class="pi"><b id="nY">黄</b><span id="wY"></span><span class="k" id="kY"></span></div><em id="sY">0</em></div>
</div>
<div id="status">接続中…</div>
<div class="board" id="board" aria-label="盤面"></div>
<div class="btns">
  <button class="b pri" id="again" disabled>もう一度</button>
  <button class="b" id="copy">招待リンクをコピー</button>
  <button class="b" id="newRoom">ロビーへ</button>
  <button class="b" id="rename">名前を変更</button>
  <button class="b" id="snd">🔊 音</button>
</div>
<p class="note">縦・横・斜めに4つ揃えたら勝ち。列をタップして置きます。<span class="kb">(キーボードの 1〜7 でも可)</span><br>最初に入った2人が対戦者、3人目以降は観戦です。</p>
</main>
<main id="lobby" hidden>
<h1>ロビー <small id="meLbl"></small></h1>
<div class="card"><b>新規部屋を作成</b><div class="row"><input id="rn" maxlength="20" placeholder="部屋の名前を付けてね" autocomplete="off"><button class="b pri" id="mk">作成</button></div><div id="rnErr"></div></div>
<h2 class="sec">部屋一覧</h2><div id="rooms"></div>
<div class="btns"><button class="b" id="lobRename">名前を変更</button></div>
</main>
<button class="b" id="palBtn" aria-label="背景色">🎨</button>
<div id="pal" hidden><div id="sws"></div><label class="cl">自由に選ぶ <input type="color" id="cbg" value="#f4f5f8"></label></div>
<div id="gate"><div class="gc"><div class="logo">🔴🟡</div><h2>4目並べ</h2><p>名前を入れて入室しよう</p><input id="nm" maxlength="12" placeholder="名前(12文字まで)" autocomplete="off"><div id="nmErr"></div><button class="b pri" id="go">はじめる</button></div></div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
var DBURL="https://mokunarabe-default-rtdb.asia-southeast1.firebasedatabase.app/";
firebase.initializeApp({databaseURL:DBURL});
var R=function(p){return firebase.database().ref(p)};
function snap(s){return{id:s.key,exists:s.exists(),data:function(){return s.val()||undefined}}}
function doc(p){return{get:function(){return R(p).once("value").then(snap)},set:function(d){return R(p).set(d)},update:function(d){return R(p).update(d)},delete:function(){return R(p).remove()},onSnapshot:function(n,e){var f=function(s){n(snap(s))};R(p).on("value",f,e);return function(){R(p).off("value",f)}}}}
var db={doc:doc,collection:function(p){var q=R(p).orderByChild("at").limitToLast(30);return{orderBy:function(){return this},limit:function(){return this},onSnapshot:function(n,e){var f=function(s){var a=[];s.forEach(function(c){a.unshift(snap(c))});n({docs:a,empty:!a.length,size:a.length})};q.on("value",f,e);return function(){q.off("value",f)}}}}};
var uid=null;try{uid=localStorage.getItem("c4uid")}catch(e){}
if(!uid){uid="u"+Math.random().toString(36).slice(2,12);try{localStorage.setItem("c4uid",uid)}catch(e){}}
window.claude={use:function(n){return Promise.resolve(n==="db"?db:n==="user"?{id:function(){return Promise.resolve(uid)}}:null)}};
})();
</script>
<script>
(function(){
var W=7,H=6,EMPTY=".".repeat(42);
var db=null,me=null,unsub=null,room="main",state=null,prev=null,claimed=false,busy=false,sound=true,hovCol=-1,myName="",lobUnsub=null,started=false,syncing=false,initP=null,canHover=!!(window.matchMedia&&matchMedia("(hover:hover)").matches);
var $=function(i){return document.getElementById(i)};
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("show")},1800)}
function getRoom(){var h=(location.hash||"").slice(1);return /^[A-Za-z0-9-]{1,24}$/.test(h)?h:""}
function beep(f,d){if(!sound)return;try{var a=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());var o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function role(){if(!state||!me)return null;var p=state.players||{};return p.R===me?"R":p.Y===me?"Y":null}
function findWin(b){var D=[[1,0],[0,1],[1,1],[1,-1]];for(var r=0;r<H;r++)for(var c=0;c<W;c++){var v=b[r*W+c];if(v==".")continue;for(var k=0;k<4;k++){var dx=D[k][0],dy=D[k][1],l=[r*W+c];for(var s=1;s<4;s++){var rr=r+dy*s,cc=c+dx*s;if(rr<0||rr>=H||cc<0||cc>=W||b[rr*W+cc]!=v)break;l.push(rr*W+cc)}if(l.length==4)return{w:v,l:l}}}return null}
function lowRow(b,c){for(var r=H-1;r>=0;r--)if(b[r*W+c]==".")return r;return -1}
function canPlay(){var p=state&&state.players;return state&&p&&p.R&&p.Y&&!state.winner&&role()===state.turn}

function buildBoard(){var bd=$("board");bd.innerHTML="";for(var c=0;c<W;c++){var col=document.createElement("button");col.className="col";col.dataset.c=c;col.setAttribute("aria-label",(c+1)+"列目に置く");for(var r=0;r<H;r++){var d=document.createElement("div");d.className="cell";col.appendChild(d)}
col.addEventListener("click",(function(c){return function(){play(c)}})(c));
col.addEventListener("mouseenter",(function(c){return function(){hovCol=c;paintHover()}})(c));
col.addEventListener("mouseleave",function(){hovCol=-1;paintHover()});
bd.appendChild(col)}}
function paintHover(){var cols=$("board").children;for(var c=0;c<W;c++)cols[c].classList.toggle("hov",c===hovCol&&canHover&&canPlay()&&lowRow(state.board,c)>=0)}

function render(){
 var s=state,cols=$("board").children;
 var b=s?s.board:EMPTY,win=s&&s.winLine?s.winLine:[];
 var newMove=prev&&s&&s.moves>prev.moves&&s.last>=0;
 for(var c=0;c<W;c++){cols[c].disabled=!canPlay();for(var r=0;r<H;r++){var i=r*W+c,cell=cols[c].children[r],v=b[i];cell.className="cell"+(v!="."?" "+v:"")+(s&&s.last===i?" last":"")+(win.indexOf(i)>=0?" win":"");cell.style.removeProperty("--d");
 if(newMove&&s.last===i){cell.classList.add("drop");cell.style.setProperty("--d",r+1)}}}
 var rl=role(),p=(s&&s.players)||{},two=p.R&&p.Y;
 var nm2=(s&&s.names)||{},sk=(s&&s.streak)||{R:0,Y:0},bs=(s&&s.best)||{R:0,Y:0};
 ["R","Y"].forEach(function(k){$("n"+k).textContent=p[k]?(nm2[k]||(k==="R"?"赤":"黄")):(k==="Y"?"待機中":"—");$("w"+k).textContent=(p[k]?(rl===k?"あなた":rl?"相手":"対戦者"):"")||" ";var t=sk[k]>=2?"🔥"+sk[k]+"連勝中":sk[k]===1?"1連勝中":"";if(bs[k]>=2)t+=(t?" / ":"")+"最高"+bs[k];$("k"+k).textContent=t||" "});
 
 $("sR").textContent=s?s.scores.R:0;$("sY").textContent=s?s.scores.Y:0;
 $("pR").classList.toggle("on",!!(s&&two&&!s.winner&&s.turn==="R"));$("pY").classList.toggle("on",!!(s&&two&&!s.winner&&s.turn==="Y"));
 var st=$("status");st.className="";
 var nm={R:"赤",Y:"黄"};
 if(!s)st.textContent="接続中…";
 else if(!two){st.textContent=rl?"相手を待っています… 招待リンクを送ってください":"対戦者の参加待ちです"}
 else if(s.winner==="D")st.textContent="引き分け!";
 else if(s.winner){st.className="win";st.textContent=rl?(rl===s.winner?"🎉 あなたの勝ち!":(nm2[s.winner]||"相手")+"の勝ち"):(nm2[s.winner]||nm[s.winner])+"の勝ち!"}
 else if(rl)st.textContent=rl===s.turn?"あなたの番です":(nm2[s.turn]||"相手")+"の番です…";
 else st.textContent="観戦中:"+(nm2[s.turn]||nm[s.turn])+"の番";
 $("again").disabled=!(s&&rl&&two&&s.moves>0);
 $("again").textContent=s&&s.winner?"もう一度":"最初からやり直す";
 paintHover();
 if(newMove){if(s.winner&&s.winner!=="D"){beep(rl===s.winner?660:300,.4)}else beep(440,.12)}
 prev=s?{moves:s.moves}:null;
}

function guard(fn){if(busy)return Promise.resolve();busy=true;return fn().catch(function(e){toast("通信に失敗しました")}).then(function(){busy=false})}
function play(c){
 if(!canPlay()||busy)return;var r=lowRow(state.board,c);if(r<0){toast("その列は満杯です");return}
 var rl=role(),i=r*W+c,b=state.board.slice(0,i)+rl+state.board.slice(i+1),w=findWin(b),moves=state.moves+1;
 var u={board:b,turn:rl==="R"?"Y":"R",last:i,moves:moves,winner:null,winLine:[]};
 if(w){u.winner=w.w;u.winLine=w.l;u.scores={R:state.scores.R+(w.w==="R"?1:0),Y:state.scores.Y+(w.w==="Y"?1:0)};var sk0=state.streak||{R:0,Y:0},bs0=state.best||{R:0,Y:0};u.streak={R:w.w==="R"?sk0.R+1:0,Y:w.w==="Y"?sk0.Y+1:0};u.best={R:Math.max(bs0.R,u.streak.R),Y:Math.max(bs0.Y,u.streak.Y)}}
 else if(moves>=W*H)u.winner="D";
 guard(function(){return db.doc("games/"+room).update(u)});
}
function again(){
 if(!state||!role())return;
 if(!state.winner&&!confirm("対局中です。最初からやり直しますか?"))return;
 var st=state.starter==="R"?"Y":"R";
 guard(function(){return db.doc("games/"+room).update({board:EMPTY,turn:st,starter:st,last:-1,moves:0,winner:null,winLine:[]})});
}

function onSnap(snap){
 clearTimeout(onSnap.t);
 if(!snap.exists){
  if(!claimed){claimed=true;
   db.doc("games/"+room).set({board:EMPTY,turn:"R",starter:"R",last:-1,moves:0,winner:null,winLine:[],scores:{R:0,Y:0},streak:{R:0,Y:0},best:{R:0,Y:0},names:{R:myName,Y:""},players:{R:me,Y:null}}).catch(function(){claimed=false;$("status").textContent="部屋を作れませんでした(権限を確認してください)"})}
  return}
 state=snap.data();var p=state.players||{};
 if(p.R!==me&&p.Y!==me&&!p.Y&&!claimed){claimed=true;
  db.doc("games/"+room).update({players:{R:p.R,Y:me},names:{R:(state.names||{}).R||"",Y:myName}}).catch(function(){claimed=false})}
 syncName();
 render();
}
function route(){var r=getRoom();if(r){if(r===room&&!$("game").hidden)return;start()}else showLobby()}
function showLobby(){
 if(unsub){unsub();unsub=null}clearTimeout(onSnap.t);state=null;prev=null;room="";
 $("game").hidden=true;$("lobby").hidden=false;$("meLbl").textContent=myName;
 if(lobUnsub)lobUnsub();
 lobUnsub=db.collection("rooms").orderBy("at","desc").limit(30).onSnapshot(renderRooms,function(){$("rooms").textContent="部屋一覧を読み込めませんでした"})}
function renderRooms(snap){var box=$("rooms");box.innerHTML="";
 if(snap.empty){var e=document.createElement("p");e.className="empty";e.textContent="まだ部屋がありません。上から作ってみよう";box.appendChild(e);return}
 snap.docs.forEach(function(d){var v=d.data()||{},id=d.id,it=document.createElement("div");it.className="ri";
  var l=document.createElement("div");l.className="rt";var b=document.createElement("b");b.textContent=v.name||id;var s=document.createElement("small");var t=new Date(v.at||0);
  s.textContent=(v.by||"?")+" · "+(t.getMonth()+1)+"/"+t.getDate()+" "+("0"+t.getHours()).slice(-2)+":"+("0"+t.getMinutes()).slice(-2);
  l.appendChild(b);l.appendChild(s);it.appendChild(l);
  var g=document.createElement("button");g.className="b pri";g.textContent="入る";g.onclick=function(){location.hash=id;route()};it.appendChild(g);
  if(v.uid===me){var x=document.createElement("button");x.className="b";x.textContent="🗑";x.setAttribute("aria-label","削除");x.onclick=function(){if(confirm("「"+(v.name||id)+"」を削除しますか?")){db.doc("rooms/"+id).delete().catch(function(){toast("削除できませんでした")});db.doc("games/"+id).delete().catch(function(){})}};it.appendChild(x)}
  box.appendChild(it)})}
function createRoom(){var n=$("rn").value.trim().slice(0,20);if(!n){$("rnErr").textContent="部屋の名前を入力してください";return}
 var a="abcdefghjkmnpqrstuvwxyz23456789",c="";for(var i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];
 $("mk").disabled=true;
